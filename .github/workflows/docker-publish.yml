name: Build  and Publish simplified Docker Image

on:
  # Manual trigger only - gives full control over when images are published
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 0.5.2, 0.6.0) - without 'v' prefix"
        required: true
        type: string
      push_latest:
        description: "Also update the 'latest' tag?"
        required: true
        type: boolean
        default: true

env:
  REGISTRY: docker.io
  # IMAGE_NAME must be lowercase for Docker
  IMAGE_NAME: enezatech/deeptutor

jobs:
  # ============================================
  # Build Docker Image for Ubuntu Server (AMD64)
  # ============================================
  # This job builds a single-architecture AMD64 image
  # optimized for Ubuntu VPS servers
  # ============================================
  build:
    name: Build AMD64 Image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and set version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"

          # Validate version format (e.g., 0.5.2, 1.0.0)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Invalid version format '$VERSION'"
            echo "   Expected format: X.Y.Z (e.g., 0.5.2, 1.0.0)"
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 Version: ${VERSION}"
          echo "📌 Push latest: ${{ github.event.inputs.push_latest }}"

      # ============================================
      # Build and push AMD64 image
      # Optimized for Ubuntu VPS servers
      # ============================================
      - name: Build and push AMD64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          # Build for AMD64 only (standard VPS architecture)
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=DeepTutor
            org.opencontainers.image.description=AI-Powered Personalized Learning Assistant
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_PORT=8001
          provenance: false

      # ============================================
      # Update 'latest' tag if requested
      # ============================================
      - name: Tag as latest
        if: github.event.inputs.push_latest == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          echo "🏷️ Tagging ${VERSION} as latest..."

          # Pull the image and retag as latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          echo "✅ Successfully tagged as latest"

  # ============================================
  # Generate Summary
  # ============================================
  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: [build]
    if: always()

    steps:
      - name: Get version
        id: version
        run: |
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Generate image summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          echo "## 🐳 Docker Images Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** \`linux/amd64\` (Ubuntu VPS optimized)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ **Build successful!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Available Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`:latest\` | Latest stable release |" >> $GITHUB_STEP_SUMMARY
          echo "| \`:${VERSION}\` | Version ${VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Quick Start" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull the image:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run the container:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d --name deeptutor \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  -p 8001:8001 -p 3782:3782 \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  -e LLM_MODEL=gpt-4o \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  -e LLM_API_KEY=your-api-key \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  -e EMBEDDING_MODEL=text-embedding-3-large \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  -e EMBEDDING_API_KEY=your-api-key \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  -v \$(pwd)/data:/app/data \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  -v \$(pwd)/config:/app/config:ro \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Target Platform" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This image is built for **Ubuntu VPS servers** with AMD64 architecture." >> $GITHUB_STEP_SUMMARY
          echo "Compatible with:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Standard VPS providers (DigitalOcean, AWS EC2, Linode, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- Intel/AMD x86_64 processors" >> $GITHUB_STEP_SUMMARY
          echo "- Ubuntu 20.04, 22.04, 24.04 LTS" >> $GITHUB_STEP_SUMMARY
